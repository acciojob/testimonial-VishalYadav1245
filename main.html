<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .main-container {
            padding: 30px;
            background-color: #f5f5f5;
        }

        h2 {
            margin-bottom: 20px;
        }

        .testimonial {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
        }

        .text {
            font-size: 15px;
        }

        .author {
            text-align: right;
            font-style: italic;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <h2>Testimonials</h2>

    <div class="testimonial">
        <p class="text">This product is amazing! I highly recommend it to anyone in need of a solution like this.</p>
        <p class="author">- John Doe</p>
    </div>

    <div class="testimonial">
        <p class="text">I have been using this for a few weeks now and it has completely transformed my workflow.</p>
        <p class="author">- Jane Smith</p>
    </div>

</div>

</body>
</html>
